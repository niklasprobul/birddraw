<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>birddraw</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fbf5e6;
    --plate: #fffaf0;
    --ink: #2b2118;
    --sepia: #6b5440;
    --faded: #9a8468;
    --rule: #c9b897;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 56px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    margin: 0;
    font-weight: normal;
    font-size: clamp(30px, 5vw, 44px);
    letter-spacing: 0.08em;
  }
  .sub {
    margin: 6px 0 0;
    color: var(--sepia);
    font-style: italic;
  }
  .ornament {
    display: block;
    width: 180px;
    height: 10px;
    margin: 14px auto 0;
  }
  figure { margin: 0; }
  .plate {
    background: var(--plate);
    padding: 10px;
    border: 1px solid var(--rule);
    box-shadow: 0 1px 0 var(--rule), 0 10px 30px -18px rgba(70, 50, 30, 0.45);
  }
  .plate svg { display: block; width: 100%; height: auto; }
  .plate svg [stroke="black"] { stroke: var(--ink); }
  figcaption {
    margin-top: 16px;
    text-align: center;
    color: var(--sepia);
  }
  figcaption .name { font-style: italic; color: var(--ink); font-size: 1.15em; }
  nav {
    margin-top: 22px;
    text-align: center;
    font-size: 15px;
  }
  nav a {
    color: var(--sepia);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 1px;
    margin: 0 12px;
  }
  nav a:hover { color: var(--ink); border-bottom-color: var(--sepia); }
  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--faded);
    font-size: 14px;
  }
  footer a { color: var(--faded); }
  footer a:hover { color: var(--sepia); }
</style>
</head>
<body>
<main>
  <header>
    <h1>birddraw</h1>
    <p class="sub">A new bird for every visitor, drawn from the moment you arrived</p>
    <svg class="ornament" viewBox="0 0 180 10" aria-hidden="true">
      <path d="M0 5 H78 M102 5 H180" stroke="#9a8468" stroke-width="1" fill="none"/>
      <path d="M90 1 L94 5 L90 9 L86 5 Z" stroke="#9a8468" stroke-width="1" fill="none"/>
    </svg>
  </header>

  <figure>
    <div class="plate" id="bird"></div>
    <figcaption id="caption"></figcaption>
  </figure>

  <nav id="nav"></nav>

  <footer>
    Procedurally generated in your browser by <a href="https://github.com/niklasprobul/birddraw">birddraw</a>,
    a sister of <a href="https://github.com/LingDong-/fishdraw">fishdraw</a> by Lingdong Huang.
  </footer>
</main>

<script src="birddraw.js"></script>
<script>
  // the seed is the bird's name: taken from the address (?seed=...) or picked by the clock
  let seed = new URLSearchParams(location.search).get('seed');
  let drawn = new Date();
  if (!seed){
    jsr = (drawn.getTime() >>> 0) || 1;
    seed = binomen();
  }
  let file = draw_svg(main(seed));
  document.getElementById('bird').innerHTML = file.replace('width="520" height="320"', 'viewBox="0 0 520 320"');

  let esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let when = drawn.toLocaleString(undefined, {dateStyle: 'long', timeStyle: 'short'});
  document.getElementById('caption').innerHTML =
    '<span class="name">' + esc(seed) + '</span><br>drawn ' + esc(when);

  let link = location.pathname + '?seed=' + encodeURIComponent(seed);
  let saved = URL.createObjectURL(new Blob([file], {type: 'image/svg+xml'}));
  document.getElementById('nav').innerHTML =
    '<a href="' + location.pathname + '">Draw another</a>' +
    '<a href="' + link + '">Keep this one</a>' +
    '<a href="' + saved + '" download="' + esc(seed.replace(/\s+/g, '_')) + '.svg">Save as SVG</a>';
</script>
</body>
</html>
